<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>IPTV iOS Edition</title>
    
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    
    <style>
        :root {
            --bg-base: #000000;
            --bg-card: #1c1c1e;
            --bg-hover: #2c2c2e;
            --accent: #0a84ff; /* Ngjyra blu e iOS */
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border: #38383a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-base); color: var(--text-main); 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            /* Shmangie e Notch-it në iPhone */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* --- EKRANI I LOGIMIT PËR MOBILE --- */
        .screen { display: none; height: 100%; width: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        #login-screen { justify-content: center; align-items: center; padding: 20px; background: #000; }
        
        .login-box { 
            background: var(--bg-card); border-radius: 20px; width: 100%; max-width: 400px; 
            padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .login-box h2 { text-align: center; margin-bottom: 20px; font-weight: 600; font-size: 22px; }
        
        /* Tabs të lëvizshëm për ekrane të ngushta */
        .tabs { 
            display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; 
            overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn { 
            flex: 1; min-width: 90px; padding: 12px 5px; background: transparent; color: var(--text-muted); 
            border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 14px; font-weight: 500;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { 
            width: 100%; padding: 15px; background: #000; border: 1px solid var(--border); 
            color: white; border-radius: 12px; font-size: 16px; /* 16px parandalon zmadhimin auto në iOS */
            outline: none; -webkit-appearance: none;
        }
        .input-group input:focus { border-color: var(--accent); }
        
        .btn-submit { 
            width: 100%; padding: 16px; background: var(--accent); color: white; 
            border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        .btn-submit:active { opacity: 0.8; }
        
        .remember-wrapper { display: flex; align-items: center; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
        .remember-wrapper input { margin-right: 10px; width: 18px; height: 18px; }

        /* --- NDËRFAQJA E APLIKACIONIT (MOBILE LAYOUT) --- */
        #main-app { flex-direction: column; background: #000; }

        /* 1. Video Player i fiksuar lart */
        .video-section { 
            width: 100%; aspect-ratio: 16/9; background: #000; 
            position: relative; z-index: 10; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        .video-wrapper { flex: 1; position: relative; }
        .video-js { width: 100%; height: 100%; }
        
        /* Shiriti i veglave nën video (Përfshin butonin Fullscreen) */
        .player-toolbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; background: var(--bg-card); border-bottom: 1px solid var(--border);
        }
        .now-playing-text { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .btn-action { 
            background: var(--bg-hover); color: white; border: none; padding: 8px 12px; 
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        /* 2. Lista e Kanaleve poshtë videos */
        .content-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .content-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px; background: #000; border-bottom: 1px solid var(--border);
        }
        .content-header h3 { font-size: 16px; font-weight: 600; }
        
        .list-area { flex: 1; overflow-y: auto; padding: 0 15px; -webkit-overflow-scrolling: touch; }
        .list-item { 
            display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .list-item:active { opacity: 0.5; }
        .item-logo { width: 40px; height: 40px; border-radius: 8px; background: var(--bg-hover); margin-right: 15px; object-fit: contain; }
        .item-title { font-size: 15px; font-weight: 500; }

        /* 3. Menuja Anësore (Kategoritë & Settings) - Rrëshqet nga e majta */
        .sidebar-menu { 
            position: absolute; top: 0; left: -100%; width: 85%; max-width: 320px; height: 100%; 
            background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 30; transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; border-right: 1px solid var(--border);
        }
        .sidebar-menu.open { left: 0; }
        
        .sidebar-header { 
            padding: 20px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        .category-list { flex: 1; overflow-y: auto; padding: 10px 0; -webkit-overflow-scrolling: touch; }
        .cat-item { padding: 15px 20px; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cat-item:active { background: var(--bg-hover); }

        /* Sfond i errët kur hapet menuja */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 20; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .overlay.active { display: block; opacity: 1; }

    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h2>Hyrje</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('m3u')">M3U List</button>
                <button class="tab-btn" onclick="switchTab('xtream')">Xtream</button>
                <button class="tab-btn" onclick="switchTab('mac')">Portal</button>
            </div>

            <div id="form-m3u" class="form-section active">
                <div class="input-group">
                    <label>Playlist URL (.m3u)</label>
                    <input type="url" id="m3u-url" placeholder="http://domain.com/lista.m3u" autocorrect="off" autocapitalize="none">
                </div>
            </div>

            <div id="form-xtream" class="form-section">
                <div class="input-group">
                    <label>Server URL</label>
                    <input type="url" id="xtream-url" placeholder="http://server.com:8080" autocorrect="off" autocapitalize="none">
                </div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="xtream-user" placeholder="Përdoruesi" autocorrect="off" autocapitalize="none">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="xtream-pass" placeholder="Fjalëkalimi">
                </div>
            </div>

            <div id="form-mac" class="form-section">
                <div class="input-group">
                    <label>Portal URL</label>
                    <input type="url" id="mac-url" placeholder="http://portal.com/c/" autocorrect="off" autocapitalize="none">
                </div>
                <div class="input-group">
                    <label>MAC Address</label>
                    <input type="text" id="mac-address" placeholder="00:1A:79:XX:XX:XX" maxlength="17" autocorrect="off" autocapitalize="characters">
                </div>
            </div>

            <label class="remember-wrapper">
                <input type="checkbox" id="remember-me" checked> Ruaj të dhënat
            </label>

            <button class="btn-submit" id="login-btn" onclick="processLogin()">Hyr në Aplikacion</button>
        </div>
    </div>

    <div id="main-app" class="screen">
        
        <div class="video-section">
            <div class="video-wrapper">
                <video id="iptv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls playsinline preload="auto" width="100%" height="100%" data-setup='{"fluid": true}'></video>
            </div>
        </div>
        
        <div class="player-toolbar">
            <div class="now-playing-text" id="now-playing">Zgjidh një kanal...</div>
            <button class="btn-action" onclick="goFullscreen()">⛶ Fullscreen</button>
        </div>

        <div class="content-section">
            <div class="content-header">
                <button class="btn-action" onclick="toggleMenu()">☰ Kategoritë</button>
                <h3 id="current-category">Të Gjitha</h3>
            </div>
            
            <div class="list-area" id="channels-list">
                </div>
            
            <div class="overlay" id="menu-overlay" onclick="toggleMenu()"></div>
            <div class="sidebar-menu" id="side-menu">
                <div class="sidebar-header">
                    <h2>Menuja</h2>
                    <button class="close-btn" onclick="toggleMenu()">×</button>
                </div>
                <div class="category-list" id="categories-list">
                    </div>
                <div style="padding: 20px; border-top: 1px solid var(--border);">
                    <button class="btn-submit" style="background: #ff3b30;" onclick="logout()">Dil nga Llogaria</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'm3u';
        let categoriesData = {}; 
        let allChannels = [];   
        let vjsPlayer = null;

        window.onload = () => {
            vjsPlayer = videojs('iptv-player');
            
            // Formatues automatik për MAC 
            document.getElementById('mac-address').addEventListener('input', function (e) {
                let val = e.target.value.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
                let newVal = '';
                for (let i = 0; i < val.length; i++) {
                    if (i > 0 && i % 2 === 0) newVal += ':';
                    newVal += val[i];
                }
                e.target.value = newVal;
            });

            // Lexo të dhënat e ruajtura
            const savedData = localStorage.getItem('iptv_ios_creds');
            if (savedData) {
                const data = JSON.parse(savedData);
                switchTab(data.method);
                if(data.method === 'm3u') document.getElementById('m3u-url').value = data.url;
                if(data.method === 'xtream') {
                    document.getElementById('xtream-url').value = data.url;
                    document.getElementById('xtream-user').value = data.user;
                    document.getElementById('xtream-pass').value = data.pass;
                }
                if(data.method === 'mac') {
                    document.getElementById('mac-url').value = data.url;
                    document.getElementById('mac-address').value = data.mac;
                }
            }
        };

        function switchTab(type) {
            currentTab = type;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            
            document.querySelector(`button[onclick="switchTab('${type}')"]`).classList.add('active');
            document.getElementById(`form-${type}`).classList.add('active');
        }

        function processLogin() {
            const remember = document.getElementById('remember-me').checked;
            let creds = { method: currentTab };

            if (currentTab === 'm3u') {
                creds.url = document.getElementById('m3u-url').value.trim();
                if(!creds.url) return alert("URL nuk mund të jetë bosh!");
            } else if (currentTab === 'xtream') {
                creds.url = document.getElementById('xtream-url').value.trim();
                creds.user = document.getElementById('xtream-user').value.trim();
                creds.pass = document.getElementById('xtream-pass').value.trim();
                if(!creds.url || !creds.user || !creds.pass) return alert("Plotëso të gjitha fushat!");
            } else if (currentTab === 'mac') {
                creds.url = document.getElementById('mac-url').value.trim();
                creds.mac = document.getElementById('mac-address').value.trim();
                if(!creds.url || !creds.mac) return alert("Plotëso të gjitha fushat!");
            }

            if (remember) {
                localStorage.setItem('iptv_ios_creds', JSON.stringify(creds));
            } else {
                localStorage.removeItem('iptv_ios_creds');
            }

            document.getElementById('login-btn').innerText = "Po ngarkohet...";

            if(currentTab === 'm3u') {
                loadM3U(creds.url);
            } else {
                alert("Xtream dhe MAC kërkojnë server backend për të anashkaluar CORS. Po kalojmë në ekranin kryesor...");
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('main-app').classList.add('active');
            }
        }

        async function loadM3U(url) {
    // 1. Kalojmë linkun tënd përmes një CORS Proxy ndërmjetës
    // Përdorim 'allorigins' që është shumë i qëndrueshëm për skedarë teksti si M3U
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);

    try {
        // 2. Kërkojmë listën përmes Proxy-t në vend të linkut direkt
        const response = await fetch(proxyUrl);
        
        if (!response.ok) throw new Error("Gabim gjatë shkarkimit nga Proxy");
        
        const text = await response.text();
        
        // Nëse lista është bosh ose proxy ktheu gabim HTML, ndaloje
        if (!text.includes('#EXTM3U') && !text.includes('#EXTINF')) {
            throw new Error("Përgjigjja nuk është një listë e vlefshme M3U");
        }

        // 3. Përpuno të dhënat dhe hap aplikacionin
        parseData(text);
        
        document.getElementById('login-screen').classList.remove('active');
        document.getElementById('main-app').classList.add('active');
        
    } catch (err) {
        console.error("Detajet e gabimit:", err);
        alert("Lista nuk mund të shkarkohet. Proxy dështoi ose ofruesi yt i IPTV-së i ka bllokuar VPN/Proxy-t publike.");
        document.getElementById('login-btn').innerText = "Hyr në Aplikacion";
    }
}

        function parseData(text) {
            categoriesData = {}; allChannels = [];
            const lines = text.split('\n');
            let currentCh = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    currentCh.name = nameParts.length > 1 ? nameParts[nameParts.length - 1].trim() : 'Kanal';
                    
                    const logoMatch = line.match(/tvg-logo=["']([^"']+)["']/i);
                    currentCh.logo = logoMatch ? logoMatch[1] : '';

                    const groupMatch = line.match(/group-title=["']([^"']+)["']/i);
                    currentCh.group = groupMatch ? groupMatch[1].trim() : 'Të Tjera';
                } else if (line.startsWith('http')) {
                    currentCh.url = line;
                    if(currentCh.name) {
                        allChannels.push({...currentCh});
                        if (!categoriesData[currentCh.group]) categoriesData[currentCh.group] = [];
                        categoriesData[currentCh.group].push({...currentCh});
                    }
                    currentCh = {};
                }
            }
            buildSidebar();
            displayChannels(allChannels, "Të Gjitha");
        }

        // Funksioni për hapjen/mbylljen e menusë anësore
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            menu.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function buildSidebar() {
            const list = document.getElementById('categories-list');
            list.innerHTML = '';
            
            const groups = Object.keys(categoriesData).sort();
            
            // Butoni 'Të Gjitha'
            const allBtn = document.createElement('div');
            allBtn.className = 'cat-item';
            allBtn.innerText = `Të Gjitha Kanalet (${allChannels.length})`;
            allBtn.onclick = () => {
                displayChannels(allChannels, "Të Gjitha");
                toggleMenu(); // Mbyll menunë pas klikimit
            };
            list.appendChild(allBtn);

            groups.forEach(group => {
                const item = document.createElement('div');
                item.className = 'cat-item';
                item.innerText = `${group} (${categoriesData[group].length})`;
                item.onclick = () => {
                    displayChannels(categoriesData[group], group);
                    toggleMenu();
                };
                list.appendChild(item);
            });
        }

        function displayChannels(channels, categoryName) {
            document.getElementById('current-category').innerText = categoryName;
            const list = document.getElementById('channels-list');
            list.innerHTML = '';

            channels.forEach(ch => {
                const item = document.createElement('div');
                item.className = 'list-item';
                
                const fallbackLogo = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><rect width='40' height='40' fill='%232c2c2e'/><text x='50%' y='50%' fill='%238e8e93' font-size='10' font-family='sans-serif' text-anchor='middle' dy='.3em'>TV</text></svg>`;
                const finalLogo = ch.logo ? ch.logo : fallbackLogo;

                item.innerHTML = `
                    <img src="${finalLogo}" class="item-logo" onerror="this.src='${fallbackLogo}'">
                    <div class="item-title">${ch.name}</div>
                `;
                
                item.onclick = () => startVideo(ch);
                list.appendChild(item);
            });
            // Ktheje scroll-in në fillim
            list.scrollTop = 0;
        }

        // Funksioni thelbësor i Videos dhe Fullscreen
        function startVideo(channel) {
            document.getElementById('now-playing').innerText = channel.name;
            
            let vType = "video/mp4";
            if(channel.url.includes('.m3u8')) vType = "application/x-mpegURL";
            if(channel.url.includes('.ts')) vType = "video/mp2t";

            vjsPlayer.src({ src: channel.url, type: vType });
            vjsPlayer.play().catch(e => console.log("iOS kërkon ndërveprim për të luajtur"));
        }

        // --- FULLSCREEN PËR iOS DHE SHFETUES TË TJERË ---
        function goFullscreen() {
            if (!vjsPlayer) return;
            
            // Video.js ka funksionet e veta për të thirrur fullscreen native
            if (vjsPlayer.isFullscreen()) {
                vjsPlayer.exitFullscreen();
            } else {
                vjsPlayer.requestFullscreen();
            }
        }

        function logout() {
            localStorage.removeItem('iptv_ios_creds');
            location.reload();
        }
    </script>
</body>
</html>
